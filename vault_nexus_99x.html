<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome Jai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="js/main.js"></script>
  <style>
    /* Structure & Features Styles */
    .dashboard { max-width: 900px; margin: 0 auto; width: 100%; }
    .header-dashboard {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
    }
    
    .nav-actions { display: flex; gap: 15px; align-items: center; }
    .action-btn { 
      background: transparent; border: 1px solid var(--border); color: var(--text);
      padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: 0.3s;
    }
    .action-btn:hover { border-color: var(--accent); color: var(--accent); }
    .action-btn.active { background: var(--card); border-color: var(--accent); color: var(--accent); }

    .month-header {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;
      color: var(--muted); margin: 40px 0 15px 0; padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
    }

    .client-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; margin-bottom: 16px; overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .client-card:hover { border-color: var(--accent); }

    .client-header {
      padding: 16px 20px; display: flex; justify-content: space-between; 
      align-items: center; cursor: pointer; user-select: none;
    }
    .client-info { display: flex; align-items: center; gap: 15px; }
    
    .avatar {
      width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      font-weight: 600; color: var(--accent); background: rgba(255, 255, 255, 0.05);
    }
    
    .client-meta h3 { margin: 0 0 4px 0; font-size: 1.1rem; transition: color 0.3s; }
    .client-meta p { margin: 0; font-size: 0.85rem; color: var(--muted); }
    
    .unread-text { color: var(--accent) !important; font-weight: bold; }
    .read-text { color: var(--text) !important; font-weight: normal; }
    
    .badge {
      font-size: 0.75rem; border: 1px solid var(--accent); color: inherit;
      padding: 6px 12px; border-radius: 20px; text-decoration: none; transition: 0.2s;
    }
    .badge:hover { background: var(--accent); color: #fff; }

    .message-thread { display: none; border-top: 1px solid var(--border); }
    .message-item {
      padding: 20px; border-bottom: 1px solid var(--border); display: flex;
      gap: 20px;
    }
    .message-item:last-child { border-bottom: none; }
    
    .msg-body { flex: 1; font-size: 0.95rem; line-height: 1.6; }
    .msg-time { font-size: 0.85rem; color: var(--muted); margin-bottom: 10px; font-weight: 500; }
    
    .btn-icon {
      background: none; border: none; font-size: 1.2rem; cursor: pointer; 
      padding: 5px; transition: 0.2s; height: fit-content;
    }
    .btn-delete { color: var(--muted); }
    .btn-delete:hover { color: #ef4444; }
    .btn-restore { color: var(--muted); font-size: 1.5rem; }
    .btn-restore:hover { color: #10b981; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  </style>
</head>
<body>

<header class="nav">
  <a href="index.html" class="logo">ANY1 Studios</a>
  
  <div class="hamburger">
    <span></span><span></span><span></span>
  </div>
  
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="pricing.html">Pricing</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
    
    <div class="theme-toggle-wrapper">
      <input type="checkbox" id="theme-switch-checkbox" class="theme-checkbox">
      <label for="theme-switch-checkbox" class="theme-label">
        <span class="theme-icon sun">☀️</span>
        <span class="theme-icon moon">🌙</span>
        <span class="theme-ball"></span>
      </label>
    </div>
  </nav>
</header>

<section class="contact reveal" style="padding-top: 140px; min-height: 100vh;">
  <div class="dashboard">
    <div class="header-dashboard">
      <h2 class="section-title" style="margin: 0;">Inquiries Vault</h2>
      <div class="nav-actions">
        <button id="btnVault" class="action-btn active" onclick="switchTab('vault')">Inbox</button>
        <button id="btnBin" class="action-btn" onclick="switchTab('bin')">Recycle Bin 🗑️</button>
        <a href="index.html" class="action-btn" style="border: none;">Logout ✕</a>
      </div>
    </div>

    <div id="vaultContent"></div>
  </div>
</section>

<footer style="border-top: 1px solid rgba(0,0,0,0.05); padding: 40px 20px; text-align: center; color: var(--muted); font-size: 0.95rem;">
  © 2026 ANY1 Studios</footer>

</body>
</html>
